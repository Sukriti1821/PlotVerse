    </g>

    <!-- Wordmark "T H I K A N A" styled with Greek-inspired Lambda 'A' from Image 3 -->
    <g transform="translate(170, 72)">
      <!-- Custom vector path wordmark or styled SVG text with font-fallback -->
      <!-- T -->
      <path d="M 0 -44 L 28 -44 L 28 -39 L 17 -39 L 17 0 L 11 0 L 11 -39 L 0 -39 Z" fill="#14213D" />
      <!-- H -->
      <path d="M 44 -44 L 50 -44 L 50 -25 L 68 -25 L 68 -44 L 74 -44 L 74 0 L 68 0 L 68 -20 L 50 -20 L 50 0 L 44 0 Z" fill="#14213D" />
      <!-- I -->
      <path d="M 90 -44 L 96 -44 L 96 0 L 90 0 Z" fill="#14213D" />
      <!-- K -->
      <path d="M 112 -44 L 118 -44 L 118 -24 L 138 -44 L 146 -44 L 127 -24 L 148 0 L 140 0 L 121 -21 L 118 -18 L 118 0 L 112 0 Z" fill="#14213D" />
      <!-- A (Image 3 styled sharp apex with chevron Λ crossbar) -->
