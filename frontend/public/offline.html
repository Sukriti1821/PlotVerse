<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline Mode — Thikana</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --emerald-500: #10b981;
        --emerald-600: #059669;
        --emerald-700: #047857;
        --slate-50: #f8fafc;
        --slate-100: #f1f5f9;
        --slate-700: #334155;
        --slate-900: #0f172a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background-color: var(--slate-50);
        color: var(--slate-900);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 1.5rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
        max-width: 480px;
        width: 100%;
        padding: 2.5rem 2rem;
        text-align: center;
      }
      .icon-circle {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        background: #ecfdf5;
        border: 2px solid #a7f3d0;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--slate-900);
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 0.9375rem;
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 1.75rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        background-color: var(--emerald-600);
        color: #ffffff;
        font-weight: 700;
        font-size: 0.9375rem;
        padding: 0.875rem 1.5rem;
        border-radius: 1rem;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.1s ease;
        box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.2);
      }
      .btn:hover {
        background-color: var(--emerald-700);
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }
      .secondary-btn {
        display: inline-block;
        margin-top: 0.75rem;
        color: #64748b;
        font-size: 0.8125rem;
        font-weight: 600;
        text-decoration: underline;
        cursor: pointer;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        background: #fffbeb;
        color: #b45309;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        border: 1px solid #fde68a;
        margin-bottom: 1.25rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="status-pill">
        <span>⚡</span> Offline Mode
      </div>
      <div class="icon-circle">
        🌲
      </div>
      <h1>You Are Currently Offline</h1>
      <p>
        It looks like you've lost internet connection. Don't worry, your cached Thikana views and app shell remain safe on this device.
      </p>
      <button class="btn" onclick="window.location.reload()">
        ↻ Check Connection & Reload
      </button>
      <a class="secondary-btn" href="/">
        Return to Cached Home Screen
      </a>
    </div>
  </body>
</html>
